# Starts Qdrant and the API. Put your key in .env first (see .env.example).
#   docker compose up --build
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    depends_on:
      - qdrant
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"

volumes:
  qdrant-data:
